name: CamerPay - CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier l'absence de console.log
        run: |
          if grep -rn "console.log" --include='*.js' .; then
            echo "Erreur : Des console.log ont été trouvés dans le code."
            exit 1
          else
            echo "Validation réussie : Aucun console.log trouvé."
          fi
  deploy:
    name: Déploiement simulation
    runs-on: ubuntu-latest
    needs: validation
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simulation deploiement CamerPay
        run: |
            echo "======================================================="
            echo "Déploiement de CamerPay en cours..."
            echo "======================================================="
            echo  "npm install ..."
            echo "npm run build ..."
            echo "npm start ..."
            echo "redemarrage du serveur Node.js..."
            echo "CamerPay a été déployé avec succès !"
